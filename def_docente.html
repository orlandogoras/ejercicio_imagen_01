<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Docente - Firebase & BBCode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; padding: 20px; color: #334155; }
    .card { max-width: 650px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { color: #1e293b; margin-bottom: 20px; font-size: 1.5rem; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    textarea { resize: vertical; min-height: 90px; }
    
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { padding: 6px 12px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
    .tab-btn:hover { background: #e2e8f0; }
    .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

    .paste-area { border: 2px dashed #cbd5e1; padding: 20px; text-align: center; border-radius: 8px; background: #f8fafc; color: #64748b; font-size: 0.9rem; cursor: pointer; }
    .paste-area:hover { border-color: #2563eb; background: #eff6ff; }
    
    .preview-box { width: 100%; height: 180px; background: #f1f5f9; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-top: 10px; }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .btn { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; }
    .btn:hover { background: #1d4ed8; }
    .alert { padding: 12px; border-radius: 6px; margin-top: 16px; display: none; font-weight: 500; text-align: center; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <div class="card">
    <h2>👨‍🏫 Panel de Carga (Docente)</h2>

    <div class="form-group">
      <label>Imagen del Ejercicio:</label>
      <div class="tabs">
        <button type="button" class="tab-btn active" onclick="cambiarModoImagen('archivo')">📁 Archivo Local</button>
        <button type="button" class="tab-btn" onclick="cambiarModoImagen('portapapeles')">📋 Pegar / Copiar</button>
        <button type="button" class="tab-btn" onclick="cambiarModoImagen('url')">🔗 Enlace URL</button>
      </div>

      <div id="modoArchivo">
        <input type="file" id="fileInput" accept="image/*" onchange="cargarDesdeArchivo(event)">
      </div>

      <div id="modoPortapapeles" style="display: none;">
        <div class="paste-area" tabindex="0" id="dropArea">
           Haz clic aquí y presiona <strong>Ctrl + V</strong> para pegar una imagen.
        </div>
      </div>

      <div id="modoUrl" style="display: none;">
        <input type="text" id="imgUrl" placeholder="https://ejemplo.com/imagen.jpg" oninput="cargarDesdeUrl()">
      </div>

      <div class="preview-box">
        <img id="imgPreview" src="" alt="Vista previa de la imagen" style="display: none;">
        <span id="previewText" style="color: #94a3b8;">Sin imagen seleccionada</span>
      </div>
    </div>

    <!-- SECCIÓN DE PREGUNTA CON BBCODE Y PREVISUALIZACIÓN -->
    <div class="form-group">
      <label for="pregunta">Pregunta (Admite BBCode):</label>

      <!-- Botones de formato rápido -->
      <div class="tabs">
        <button type="button" class="tab-btn" onclick="insertarBBCode('[b]', '[/b]')"><b>B</b></button>
        <button type="button" class="tab-btn" onclick="insertarBBCode('[i]', '[/i]')"><i>I</i></button>
        <button type="button" class="tab-btn" onclick="insertarBBCode('[u]', '[/u]')"><u>U</u></button>
        <button type="button" class="tab-btn" onclick="insertarBBCode('[color=red]', '[/color]')">🎨 Rojo</button>
        <button type="button" class="tab-btn" onclick="insertarBBCode('[color=#16a34a]', '[/color]')">🎨 Verde</button>
        <button type="button" class="tab-btn" onclick="insertarBBCode('[size=1.3rem]', '[/size]')">🔤 Grande</button>
        <button type="button" class="tab-btn" onclick="insertarBBCode('[bg=#fef08a]', '[/bg]')">🖍️ Resaltar</button>
      </div>

      <textarea id="pregunta" placeholder="Escribe tu pregunta... Ej: Resuelve la [b][color=red]ecuación[/color][/b] siguiente:" oninput="actualizarPrevisualizacion()"></textarea>

      <!-- DIV DE PREVISUALIZACIÓN EN TIEMPO REAL -->
      <label style="margin-top: 10px; font-size: 0.85rem; color: #64748b;">👁️ Previsualización para el estudiante:</label>
      <div id="previewPregunta" style="background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid #2563eb; font-size: 1.05rem; min-height: 48px; word-break: break-word;">
        <span style="color: #94a3b8; font-style: italic;">La vista previa aparecerá aquí...</span>
      </div>
    </div>

    <div class="form-group">
      <label for="respuesta">Respuesta Correcta:</label>
      <input type="text" id="respuesta" placeholder="Texto exacto de la respuesta esperada">
    </div>

    <button class="btn" onclick="publicarEjercicio()">🚀 Publicar a la Nube (Firebase)</button>

    <div id="mensajeEstado" class="alert"></div>
  </div>

  <!-- Librerías de Firebase SDK CDN (v8.10.1) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ⚠️ REEMPLAZA ESTE OBJETO CON TUS CLAVES OBTENIDAS DE FIREBASE
    const firebaseConfig = {
  apiKey: "AIzaSyAiSyf_nDuXixlHWPGEgmSsQtHKhqM_02w",
  authDomain: "ejercicioimagen.firebaseapp.com",
  databaseURL: "https://ejercicioimagen-default-rtdb.firebaseio.com",
  projectId: "ejercicioimagen",
  storageBucket: "ejercicioimagen.firebasestorage.app",
  messagingSenderId: "50162736216",
  appId: "1:50162736216:web:11b791429d1e059eeb3e2d"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let imagenBase64Actual = '';

    // PARSER DE BBCODE A HTML
    function parseBBCode(texto) {
      if (!texto) return '';
      let html = texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      html = html
        .replace(/\[b\](.*?)\[\/b\]/gi, '<strong>$1</strong>')
        .replace(/\[i\](.*?)\[\/i\]/gi, '<em>$1</em>')
        .replace(/\[u\](.*?)\[\/u\]/gi, '<span style="text-decoration: underline;">$1</span>')
        .replace(/\[color=(.*?)\](.*?)\[\/color\]/gi, '<span style="color: $1;">$2</span>')
        .replace(/\[size=(.*?)\](.*?)\[\/size\]/gi, '<span style="font-size: $1;">$2</span>')
        .replace(/\[bg=(.*?)\](.*?)\[\/bg\]/gi, '<span style="background-color: $1; padding: 2px 4px; border-radius: 3px;">$2</span>')
        .replace(/\n/g, '<br>');

      return html;
    }

    function actualizarPrevisualizacion() {
      const textoRaw = document.getElementById('pregunta').value;
      const previewDiv = document.getElementById('previewPregunta');
      
      if (textoRaw.trim() === '') {
        previewDiv.innerHTML = '<span style="color: #94a3b8; font-style: italic;">La vista previa aparecerá aquí...</span>';
      } else {
        previewDiv.innerHTML = parseBBCode(textoRaw);
      }
    }

    function insertarBBCode(inicio, fin) {
      const textarea = document.getElementById('pregunta');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const textoSeleccionado = textarea.value.substring(start, end) || 'texto';
      
      const nuevoTexto = textarea.value.substring(0, start) + inicio + textoSeleccionado + fin + textarea.value.substring(end);
      textarea.value = nuevoTexto;
      textarea.focus();
      textarea.setSelectionRange(start + inicio.length, start + inicio.length + textoSeleccionado.length);
      
      actualizarPrevisualizacion();
    }

    function cambiarModoImagen(modo) {
      document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
      document.getElementById('modoArchivo').style.display = 'none';
      document.getElementById('modoPortapapeles').style.display = 'none';
      document.getElementById('modoUrl').style.display = 'none';

      if (modo === 'archivo') {
        event.target.classList.add('active');
        document.getElementById('modoArchivo').style.display = 'block';
      } else if (modo === 'portapapeles') {
        event.target.classList.add('active');
        document.getElementById('modoPortapapeles').style.display = 'block';
        document.getElementById('dropArea').focus();
      } else if (modo === 'url') {
        event.target.classList.add('active');
        document.getElementById('modoUrl').style.display = 'block';
      }
    }

    function cargarDesdeArchivo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => mostrarVistaPrevia(e.target.result);
        reader.readAsDataURL(file);
      }
    }

    document.addEventListener('paste', function(event) {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (e) => {
            mostrarVistaPrevia(e.target.result);
            cambiarModoImagen('portapapeles');
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    function cargarDesdeUrl() {
      const url = document.getElementById('imgUrl').value.trim();
      if (url) mostrarVistaPrevia(url);
    }

    function mostrarVistaPrevia(src) {
      imagenBase64Actual = src;
      const img = document.getElementById('imgPreview');
      const text = document.getElementById('previewText');
      img.src = src;
      img.style.display = 'block';
      text.style.display = 'none';
    }

    function publicarEjercicio() {
      const pregunta = document.getElementById('pregunta').value.trim();
      const respuesta = document.getElementById('respuesta').value.trim();
      const msg = document.getElementById('mensajeEstado');

      if (!pregunta || !respuesta) {
        alert('Por favor, completa la pregunta y la respuesta correcta.');
        return;
      }

      const terna = {
        imagen: imagenBase64Actual || 'https://via.placeholder.com/600x300?text=Sin+Imagen',
        pregunta: pregunta,
        respuesta: respuesta,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      database.ref('ejercicio_actual').set(terna)
        .then(() => {
          msg.className = 'alert alert-success';
          msg.textContent = '🌐 ¡Ejercicio publicado en la nube correctamente!';
          msg.style.display = 'block';
          setTimeout(() => { msg.style.display = 'none'; }, 3000);
        })
        .catch((error) => {
          msg.className = 'alert alert-danger';
          msg.textContent = '❌ Error al guardar en Firebase: ' + error.message;
          msg.style.display = 'block';
        });
    }
  </script>
</body>
</html>
